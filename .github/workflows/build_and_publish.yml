name: Build & Publish V100 Toolbox

on:
  workflow_dispatch:
  repository_dispatch:
    types: [llama-cpp-update]

env:
  DOCKERHUB_REPO: docker.io/kyuz0/nvidia-v100-ai-toolboxes
  LOCAL_PREFIX: llama-v100

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.cuda-12
            name: cuda-12
            channel: latest
          - dockerfile: Dockerfile.vulkan
            name: vulkan
            channel: vulkan

    steps:
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          docker builder prune --all --force
          echo "After cleanup:" && df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build timestamp
        run: echo "BUILD_TS=$(date +%Y%m%dT%H%M%S)" >> $GITHUB_ENV

      - name: Build & push Docker image
        working-directory: toolboxes
        shell: bash
        run: |
          set -euo pipefail
          DF="${{ matrix.dockerfile }}"
          NAME="${{ matrix.name }}"
          LI="${LOCAL_PREFIX}-${NAME}"
          TAG="${NAME}_${BUILD_TS}"
          IMM="${DOCKERHUB_REPO}:${TAG}"
          CHN="${DOCKERHUB_REPO}:${{ matrix.channel }}"

          echo "→ Building ${DF}"
          docker build --no-cache -t "${LI}" -f "${DF}" .

          EXTRA_ARGS=""
          if [[ "${NAME}" == "cuda-12" ]]; then
            EXTRA_ARGS="-e LD_LIBRARY_PATH=/usr/local/lib/stubs"
          fi

          echo "→ Running smoke test..."
          docker run --rm ${EXTRA_ARGS} "${LI}" llama version
          docker run --rm ${EXTRA_ARGS} "${LI}" llama-cli --help || { status=$?; echo "llama-cli exited with status $status"; [[ $status -eq 0 || $status -eq 1 || $status -eq 134 ]]; }
          docker run --rm ${EXTRA_ARGS} "${LI}" llama-server --help || { status=$?; echo "llama-server exited with status $status"; [[ $status -eq 0 || $status -eq 1 || $status -eq 134 ]]; }

          echo "→ Tag & push immutable → ${IMM}"
          docker tag "${LI}" "${IMM}"
          docker push "${IMM}"

          echo "→ Tag & push channel → ${CHN}"
          docker tag "${IMM}" "${CHN}"
          docker push "${CHN}"
